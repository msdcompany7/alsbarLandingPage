services:
  postgres:
    image: postgres:16-alpine
    container_name: alsbar-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: electricity_shop
      POSTGRES_PASSWORD: electricity_shop_secret
      POSTGRES_DB: electricity_shop
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
